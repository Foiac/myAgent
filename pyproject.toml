[tool.poetry]
name = "my-agent"
version = "0.1.0"
description = "Agente de IA generativa com arquitetura hexagonal"
authors = ["Cio França <kaio_cfs@hotmail.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.110.0"
uvicorn = { extras = ["standard"], version = "^0.29.0" }
openai = "^1.0.0"
python-dotenv = "^1.0.0"
pydantic = "^2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
